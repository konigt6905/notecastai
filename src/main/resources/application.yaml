# ===========================================================================
# NOTECAST AI — Shared Configuration (all profiles)
# ===========================================================================
# Profile-specific overrides: application-{local,dev,prod}.yaml
# Active profile defaults to 'local' for developer convenience.
# In deployed environments set SPRING_PROFILES_ACTIVE=dev|prod.
# ===========================================================================

server:
  port: 8080

# --- Application ---
application:
  email:
    from: no-reply@beatthecodes.com
  domain: ${APPLICATION_DOMAIN}

# --- Object storage (MinIO, S3-compatible) ---
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  region: ${MINIO_REGION:us-east-1}

# --- Spring Core ---
spring:
  application:
    name: notecastai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # --- Database ---
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      # warn if a connection is held longer than 30s
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notecastai

  # --- Flyway Migrations ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    schemas: notecastai
    default-schema: notecastai

# --- Authentication (Clerk JWT) ---
clerk:
  issuer: ${CLERK_ISSUER}
  jwks: ${CLERK_JWKS}
  audience: ${CLERK_AUDIENCE}

# --- AI Providers ---
ai:
  openrouter:
    api:
      url: https://openrouter.ai/api/v1
      key: ${AI_OPENROUTER_API_KEY}
  openai:
    api:
      url: https://api.openai.com/v1
      key: ${AI_OPENAI_KEY}
  tts:
    voice-provider: OPENAI

# --- Rate Limiting ---
rate-limit:
  # Per-user limits (Bucket4j)
  tts:
    capacity: 5
    refill-seconds: 60
  ai-generation:
    capacity: 10
    refill-seconds: 60
  ai-format:
    capacity: 20
    refill-seconds: 60
  ai-chat:
    capacity: 30
    refill-seconds: 60
  standard:
    capacity: 100
    refill-seconds: 60
  # Global limits (Resilience4j) — hard ceiling across all users per instance
  global-ai:
    limit-per-period: 60
    period-seconds: 60
  global-tts:
    limit-per-period: 20
    period-seconds: 60

# --- Swagger / OpenAPI (disabled by default, enabled per profile) ---
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

# --- Actuator (minimal by default) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  info:
    env:
      enabled: true
  health:
    defaults:
      enabled: true

# --- Application Info (actuator/info) ---
info:
  app:
    name: ${spring.application.name}
    description: Notecast AI - Voice Notes Processing Platform
    version: '@project.version@'
    encoding: '@project.build.sourceEncoding@'
    java:
      version: '@java.version@'

# --- Logging ---
logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.type.descriptor.sql.BasicBinder: warn
    com.notecastai: info
    org.springframework.security: warn
